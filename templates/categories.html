{% extends 'base.html' %}
{% block content %}
	<form method="get" action="/categories" class="w3-row-padding w3-margin-bottom">
		<div class="w3-col m8">
			<!-- (-----------------) edit search -->
			<input class="w3-input w3-border" type="text" name="q" value="{{ q }}" placeholder="Search category"/>
			<!-- (-----------------) end -->
		</div>
		<div class="w3-col m4">
			<button class="w3-button w3-blue" type="submit">SEARCH</button>
			<a class="w3-button w3-gray" href="/categories">CLEAR</a>
			<button class="w3-button w3-green" type="button" onclick="addcategory()">+ ADD CATEGORY</button>
		</div>
	</form>
	<table class="w3-table-all w3-animate-top w3-card-4">
		<!-- (-----------------) edit category -->
		<tr>
			<th>ID</th>
			<th>NAME</th>
			<th>CONTROL</th>
		</tr>
		{% for category in categories %}
		<tr>
			<td>{{ category['id'] }}</td>
			<td>{{ category['name'] }}</td>
			<td>
				<button class="w3-button w3-blue w3-tiny" type="button" data-id="{{ category['id'] }}" data-name="{{ category['name'] }}" onclick="editcategory(this)">EDIT</button>
				<button class="w3-button w3-red w3-tiny" type="button" onclick="deletecategory('{{ category['id'] }}')">DELETE</button>
			</td>
		</tr>
		{% else %}
		<tr>
			<td colspan="3">No categories found</td>
		</tr>
		{% endfor %}
		<!-- (-----------------) end -->
	</table>
	<div class="w3-modal" id="categorymodal">
		<div class="w3-modal-content w3-animate-top">
			<div class="w3-container w3-blue">
				<h4 id="modaltitle">ADD CATEGORY</h4>
				<span class="w3-btn w3-display-topright" onclick="modalcontrol('categorymodal','none')">&times;</span>
			</div>
			<div class="w3-container">
				<!-- (-----------------) edit category -->
				<form action="/savecategory" method="post" id="categoryform">
					<input type="hidden" value="0" id="savetype" name="savetype"/>
					<input type="hidden" value="" id="itemid" name="id"/>
					<p>
						<label><b>NAME</b></label>
						<input type="text" name="name" id="name" class="w3-input w3-border"/>
					</p>
					<!-- (-----------------) end -->
					<p class="w3-right">
						<input type="submit" value="SAVE" class="w3-button w3-blue"/>
						<input type="reset" value="CANCEL" class="w3-button w3-red" onclick="modalcontrol('categorymodal','none')"/>
					</p>
				</form>
			</div>
		</div>
	</div>
	<script>
		function modalcontrol(modalname,control){
			document.getElementById(modalname).style.display=control;
		}
		function addcategory(){
			document.getElementById('categoryform').reset();
			document.getElementById('savetype').value="0";
			document.getElementById('itemid').value="";
			document.getElementById('modaltitle').innerHTML="ADD CATEGORY";
			modalcontrol('categorymodal','block');
		}
		function editcategory(btn){
			modalcontrol('categorymodal','block');
			document.getElementById('modaltitle').innerHTML="EDIT CATEGORY";
			document.getElementById('savetype').value="1";
			document.getElementById('itemid').value=btn.dataset.id;
			document.getElementById('name').value=btn.dataset.name;
		}
		function deletecategory(id){
			var ok = confirm("Delete this category?");
			if (ok==true){
				location.href='/deletecategory?id='+id;
			}
		}
	</script>
{% endblock %}
